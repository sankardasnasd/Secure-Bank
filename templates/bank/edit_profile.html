{% extends 'bank/bank home sub.html' %}

{% block body %}

<style>

    .edit-container {
        max-width: 800px;
        margin: 30px auto;
    }

    .edit-card {
        background: white;
        padding: 35px;
        border-radius: 12px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .edit-header {
        margin-bottom: 30px;
    }

    .edit-header h2 {
        color: #172b4d;
        margin-bottom: 7px;
    }

    .edit-header p {
        color: #667085;
        font-size: 14px;
    }

    .form-row {
        display: flex;
        gap: 18px;
    }

    .form-group {
        width: 100%;
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        color: #344054;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 7px;
    }

    .form-group input,
    .form-group textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #d0d5dd;
        border-radius: 7px;
        outline: none;
        font-size: 14px;
        box-sizing: border-box;
    }

    .form-group input:focus,
    .form-group textarea:focus {
        border-color: #1261c9;
        box-shadow: 0 0 0 3px rgba(18,97,201,0.1);
    }

    .form-group textarea {
        height: 100px;
        resize: vertical;
    }

    .current-file {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        padding: 12px;
        border-radius: 7px;
        margin-bottom: 10px;
        font-size: 14px;
    }

    .current-file a {
        color: #1261c9;
        text-decoration: none;
        font-weight: 600;
    }

    .buttons {
        display: flex;
        gap: 12px;
        margin-top: 10px;
    }

    .save-btn {
        border: none;
        background: #1261c9;
        color: white;
        padding: 12px 25px;
        border-radius: 7px;
        font-weight: 600;
        cursor: pointer;
    }

    .cancel-btn {
        background: #e5e7eb;
        color: #344054;
        padding: 12px 25px;
        border-radius: 7px;
        text-decoration: none;
        font-weight: 600;
    }

    @media (max-width: 650px) {

        .form-row {
            flex-direction: column;
            gap: 0;
        }

        .buttons {
            flex-direction: column;
        }

    }

</style>


<div class="edit-container">


    <div class="edit-card">


        <div class="edit-header">

            <h2>
                Edit Bank Profile
            </h2>

            <p>
                Update your bank information
            </p>

        </div>


        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}


            <div class="form-row">


                <div class="form-group">

                    <label>
                        Bank Name
                    </label>

                    <input
                        type="text"
                        name="bank_name"
                        value="{{ bank.bank_name }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Bank Code
                    </label>

                    <input
                        type="text"
                        name="bank_code"
                        value="{{ bank.bank_code }}"
                        required
                    >

                </div>


            </div>


            <div class="form-row">


                <div class="form-group">

                    <label>
                        IFSC Code
                    </label>

                    <input
                        type="text"
                        name="ifsc_code"
                        value="{{ bank.ifsc_code }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        value="{{ bank.email }}"
                        required
                    >

                </div>


            </div>


            <div class="form-group">

                <label>
                    Phone Number
                </label>

                <input
                    type="text"
                    name="phone"
                    value="{{ bank.phone }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Address
                </label>

                <textarea
                    name="address"
                    required
                >{{ bank.address }}</textarea>

            </div>


            <div class="form-group">

                <label>
                    Current License Document
                </label>

                {% if bank.license_doc %}

                    <div class="current-file">

                        <a
                            href="{{ bank.license_doc.url }}"
                            target="_blank"
                        >
                            View Current License Document
                        </a>

                    </div>

                {% else %}

                    <div class="current-file">
                        No license document uploaded.
                    </div>

                {% endif %}

            </div>


            <div class="form-group">

                <label>
                    Upload New License Document
                </label>

                <input
                    type="file"
                    name="license_doc"
                    accept=".pdf,.jpg,.jpeg,.png"
                >

            </div>


            <div class="buttons">

                <button
                    type="submit"
                    class="save-btn"
                >
                    Save Changes
                </button>


                <a
                    href="{% url 'bank_profile' %}"
                    class="cancel-btn"
                >
                    Cancel
                </a>

            </div>


        </form>


    </div>


</div>

{% endblock %}
